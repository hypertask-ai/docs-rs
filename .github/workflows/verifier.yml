name: Verifier

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to verify
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: verifier-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  pstack-verifier:
    name: pstack-verifier
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPO: ${{ github.repository }}
      SERVER_URL: ${{ github.server_url }}
      RUN_ID: ${{ github.run_id }}
      LIVE_URL: https://docs.hypertask.ai
    steps:
      - name: Resolve the pull request, its parent commit and its head commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          case "${PR_NUMBER:-}" in
            ''|*[!0-9]*) echo "::error::No pull request number was given."; exit 1 ;;
          esac
          gh pr view "$PR_NUMBER" --repo "$REPO" --json state,isDraft,headRefOid,baseRefOid,headRepository,url > "$RUNNER_TEMP/pr.json"
          state="$(jq -r .state "$RUNNER_TEMP/pr.json")"
          draft="$(jq -r .isDraft "$RUNNER_TEMP/pr.json")"
          sha="$(jq -r .headRefOid "$RUNNER_TEMP/pr.json" | tr '[:upper:]' '[:lower:]')"
          base="$(jq -r .baseRefOid "$RUNNER_TEMP/pr.json" | tr '[:upper:]' '[:lower:]')"
          head_repo="$(jq -r .headRepository.nameWithOwner "$RUNNER_TEMP/pr.json")"
          case "$sha" in
            *[!0-9a-f]*|'') echo "::error::The head commit is not a full commit SHA: $sha"; exit 1 ;;
          esac
          if [ "${#sha}" -ne 40 ]; then
            echo "::error::The head commit is not a full commit SHA: $sha"
            exit 1
          fi
          case "$base" in
            *[!0-9a-f]*|'') echo "::error::The parent commit is not a full commit SHA: $base"; exit 1 ;;
          esac
          if [ "${#base}" -ne 40 ]; then
            echo "::error::The parent commit is not a full commit SHA: $base"
            exit 1
          fi
          go=yes
          if [ "$head_repo" != "$REPO" ]; then
            go=no
            echo "::notice::skipped: pull request $PR_NUMBER comes from the fork $head_repo, and a fork gets no verifier setting."
          elif [ "$state" != "OPEN" ]; then
            go=no
            echo "::notice::skipped: pull request $PR_NUMBER is $state."
          elif [ "$draft" = "true" ]; then
            go=no
            echo "::notice::skipped: pull request $PR_NUMBER is a draft. The verifier runs when it is ready for review."
          fi
          printf 'go=%s\nnumber=%s\nsha=%s\nbase=%s\n' "$go" "$PR_NUMBER" "$sha" "$base" >> "$GITHUB_OUTPUT"

      - name: Check out the pull request head
        if: steps.target.outputs.go == 'yes'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 24.18.0
        if: steps.target.outputs.go == 'yes'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0

      - name: Check the diff reader on a fixture
        if: steps.target.outputs.go == 'yes'
        run: node --test verify/diff.test.mjs

      - name: Enable corepack pnpm
        if: steps.target.outputs.go == 'yes'
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate

      - name: Install dependencies for the head
        if: steps.target.outputs.go == 'yes'
        run: pnpm install --frozen-lockfile

      - name: Fetch pinned source objects for the head
        if: steps.target.outputs.go == 'yes'
        run: pnpm sources:fetch

      - name: Build the head the way ci.yml does
        if: steps.target.outputs.go == 'yes'
        run: pnpm turbo run build --concurrency=2

      - name: Check out the parent commit with full history, the way ci.yml does
        if: steps.target.outputs.go == 'yes'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.target.outputs.base }}
          path: parent
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies for the parent
        if: steps.target.outputs.go == 'yes'
        working-directory: ${{ github.workspace }}/parent
        run: pnpm install --frozen-lockfile

      - name: Fetch pinned source objects for the parent
        if: steps.target.outputs.go == 'yes'
        working-directory: ${{ github.workspace }}/parent
        run: pnpm sources:fetch

      - name: Build the parent the way ci.yml does
        if: steps.target.outputs.go == 'yes'
        working-directory: ${{ github.workspace }}/parent
        run: pnpm turbo run build --concurrency=2

      - name: Install Playwright Chromium for the verifier
        if: steps.target.outputs.go == 'yes'
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/screens"

      - name: Serve the built sites and each app's own dev server
        if: steps.target.outputs.go == 'yes'
        env:
          BASE_SHA: ${{ steps.target.outputs.base }}
          SCREENS_DIR: ${{ runner.temp }}/screens
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/serve-static.mjs" <<'SERVER'
          import { createReadStream } from "node:fs";
          import { stat } from "node:fs/promises";
          import { createServer } from "node:http";
          import path from "node:path";

          const root = path.resolve(process.argv[2]);
          const port = Number(process.argv[3]);

          const types = {
            ".avif": "image/avif",
            ".css": "text/css; charset=utf-8",
            ".html": "text/html; charset=utf-8",
            ".ico": "image/x-icon",
            ".jpeg": "image/jpeg",
            ".jpg": "image/jpeg",
            ".js": "text/javascript; charset=utf-8",
            ".json": "application/json; charset=utf-8",
            ".map": "application/json; charset=utf-8",
            ".md": "text/markdown; charset=utf-8",
            ".mjs": "text/javascript; charset=utf-8",
            ".png": "image/png",
            ".svg": "image/svg+xml",
            ".txt": "text/plain; charset=utf-8",
            ".wasm": "application/wasm",
            ".webmanifest": "application/manifest+json",
            ".webp": "image/webp",
            ".woff": "font/woff",
            ".woff2": "font/woff2",
            ".xml": "application/xml; charset=utf-8",
          };

          const candidatesFor = (urlPath) => {
            const base = path.resolve(root, decodeURIComponent(urlPath).replace(/^\/+/u, "").replace(/\/+$/u, ""));
            if (base !== root && !base.startsWith(`${root}${path.sep}`)) {
              return [];
            }
            return [base, path.join(base, "index.html"), `${base}.html`];
          };

          const fileAt = async (paths) => {
            for (const candidate of paths) {
              try {
                const info = await stat(candidate);
                if (info.isFile()) {
                  return candidate;
                }
              } catch {}
            }
            return undefined;
          };

          createServer(async (request, response) => {
            const url = new URL(request.url ?? "/", "http://127.0.0.1");
            const found = await fileAt(candidatesFor(url.pathname));
            if (found === undefined) {
              const fallback = await fileAt([path.join(root, "404.html")]);
              response.writeHead(404, {
                "content-type": fallback === undefined ? types[".txt"] : types[".html"],
              });
              if (request.method === "HEAD" || fallback === undefined) {
                response.end(fallback === undefined ? `404 ${url.pathname}\n` : undefined);
                return;
              }
              createReadStream(fallback).pipe(response);
              return;
            }
            response.writeHead(200, {
              "content-type": types[path.extname(found)] ?? "application/octet-stream",
            });
            if (request.method === "HEAD") {
              response.end();
              return;
            }
            createReadStream(found).pipe(response);
          }).listen(port, "127.0.0.1", () => {
            console.log(`serving ${root} on http://127.0.0.1:${port}`);
          });
          SERVER

          site_root() {
            local tree="$1" candidate
            for candidate in apps/web/dist/client apps/*/dist/client; do
              if [ -f "$tree/$candidate/index.html" ]; then
                printf '%s\n' "$tree/$candidate"
                return 0
              fi
            done
            echo "::error::$tree left no apps/*/dist/client/index.html."
            find "$tree/apps" -maxdepth 3 -type d -name dist -print
            return 1
          }

          app_of() {
            local client
            client="$(site_root "$1")"
            printf '%s\n' "${client%/dist/client}"
          }

          wait_for_page() {
            local url="$1" pid="$2" attempts="$3"
            for _ in $(seq 1 "$attempts"); do
              if curl --silent --fail --output /dev/null --max-time 60 "$url"; then
                return 0
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                return 1
              fi
              sleep 2
            done
            return 1
          }

          start_static() {
            local tree="$1" port="$2" side="$3" root pid
            root="$(site_root "$tree")"
            node "$RUNNER_TEMP/serve-static.mjs" "$root" "$port" > "$RUNNER_TEMP/$side.log" 2>&1 &
            pid="$!"
            printf '%s\n' "$pid" > "$RUNNER_TEMP/$side.pid"
            if ! wait_for_page "http://127.0.0.1:$port/" "$pid" 60; then
              cat "$RUNNER_TEMP/$side.log"
              echo "::error::the built files for the $side tree did not answer on port $port."
              return 1
            fi
            printf '%s\n' "$root" > "$RUNNER_TEMP/$side.root"
            printf 'static\n' > "$RUNNER_TEMP/$side.mode"
          }

          start_dev() {
            local tree="$1" port="$2" side="$3" app vite pid
            app="$(app_of "$tree")" || return 1
            [ -f "$app/package.json" ] || return 1
            [ "$(jq -r '.scripts.dev // ""' "$app/package.json")" != "" ] || return 1
            vite="$app/node_modules/.bin/vite"
            [ -x "$vite" ] || return 1
            (
              cd "$app"
              exec "$vite" dev --host 127.0.0.1 --port "$port" --strictPort
            ) > "$RUNNER_TEMP/$side-dev.log" 2>&1 &
            pid="$!"
            printf '%s\n' "$pid" > "$RUNNER_TEMP/$side-dev.pid"
            if ! wait_for_page "http://127.0.0.1:$port/" "$pid" 90; then
              echo "::notice::$side dev server: $app declares a dev script but its vite server did not answer on port $port within 180 seconds. See the run evidence for its log."
              return 1
            fi
            return 0
          }

          head_root="$(site_root "$GITHUB_WORKSPACE")"
          base_root="$(site_root "$GITHUB_WORKSPACE/parent")"
          start_static "$GITHUB_WORKSPACE" 4173 site
          start_static "$GITHUB_WORKSPACE/parent" 4174 parent

          site_dev=""
          base_dev=""
          if start_dev "$GITHUB_WORKSPACE" 4175 site; then
            site_dev="http://127.0.0.1:4175"
          fi
          if start_dev "$GITHUB_WORKSPACE/parent" 4176 parent; then
            base_dev="http://127.0.0.1:4176"
          fi

          head_mode="static"
          parent_mode="static"
          if [ -n "$site_dev" ]; then head_mode="static and the app's own dev server"; fi
          if [ -n "$base_dev" ]; then parent_mode="static and the app's own dev server"; fi

          {
            printf 'SITE_URL=http://127.0.0.1:4173\n'
            printf 'BASE_URL=http://127.0.0.1:4174\n'
            printf 'SITE_DEV_URL=%s\nBASE_DEV_URL=%s\n' "$site_dev" "$base_dev"
            printf 'SITE_ROOT=%s\nBASE_ROOT=%s\n' "$head_root" "$base_root"
            printf 'SERVE_MODE_HEAD=%s\nSERVE_MODE_PARENT=%s\n' "$head_mode" "$parent_mode"
          } >> "$GITHUB_ENV"

          {
            printf 'head %s http://127.0.0.1:4173 from %s, dev server %s\n' "$SHA" "$head_root" "${site_dev:-not started}"
            printf 'parent %s http://127.0.0.1:4174 from %s, dev server %s\n' "$BASE_SHA" "$base_root" "${base_dev:-not started}"
            printf 'live %s\n' "$LIVE_URL"
            printf 'screens %s\n' "$SCREENS_DIR"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Read the change under review from the checkout
        if: steps.target.outputs.go == 'yes'
        env:
          SHA: ${{ steps.target.outputs.sha }}
          BASE_SHA: ${{ steps.target.outputs.base }}
          DIFF_LIMIT_BYTES: "200000"
        run: |
          set -euo pipefail
          if ! git -C "$GITHUB_WORKSPACE" cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git -C "$GITHUB_WORKSPACE" fetch --no-tags "$GITHUB_WORKSPACE/parent" "$BASE_SHA"
          fi
          node "$GITHUB_WORKSPACE/verify/diff.mjs" \
            --repo "$GITHUB_WORKSPACE" \
            --base "$BASE_SHA" \
            --head "$SHA" \
            --out "$RUNNER_TEMP" \
            --limit "$DIFF_LIMIT_BYTES" > "$RUNNER_TEMP/diff.json"
          jq -r '"diff: \(.files) files, \(.bytes) bytes, prompt copy capped: \(.capped)"' "$RUNNER_TEMP/diff.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the verifier prompt with the change under review
        if: steps.target.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          SCREENS_DIR: ${{ runner.temp }}/screens
          SHA: ${{ steps.target.outputs.sha }}
          BASE_SHA: ${{ steps.target.outputs.base }}
          PR: ${{ steps.target.outputs.number }}
        run: |
          set -euo pipefail
          gh pr view "$PR" --repo "$REPO" --json title,body,url --jq '"Title: \(.title)\n\nBody:\n\(if .body == "" or .body == null then "(empty)" else .body end)\n\nURL: \(.url)"' > "$RUNNER_TEMP/pr-meta.md"
          diff_bytes="$(jq -r '.bytes' "$RUNNER_TEMP/diff.json")"
          diff_files="$(jq -r '.files' "$RUNNER_TEMP/diff.json")"
          diff_capped="$(jq -r '.capped' "$RUNNER_TEMP/diff.json")"
          diff_capped_bytes="$(jq -r '.cappedBytes' "$RUNNER_TEMP/diff.json")"
          diff_limit="$(jq -r '.limit' "$RUNNER_TEMP/diff.json")"
          if [ -n "${SITE_DEV_URL:-}" ] && [ -n "${BASE_DEV_URL:-}" ]; then
            dev_note="- The app's own dev server renders the same application in Node. The head is at $SITE_DEV_URL and the parent is at $BASE_DEV_URL. Use it for what a file server cannot answer: the status code of an unknown address, a trailing-slash request, the app's own 404 page, and worker-only routes such as /rpc. That mode also shows a floating devtools toggle button, which the deployed site does not have. Ignore that one control and judge everything else."
          elif [ -n "${SITE_DEV_URL:-}" ] || [ -n "${BASE_DEV_URL:-}" ]; then
            dev_note="- Only one side answered on its own dev server this run: head ${SITE_DEV_URL:-none}, parent ${BASE_DEV_URL:-none}. A behaviour comparison between the two sides is therefore not possible. Use the dev server that answered for questions about that one side, and say plainly which side you could not compare."
          else
            dev_note="- No dev server answered on this run, so only the built files are served, which is what a deploy would upload. A redirect, a 404 status or a worker-only route cannot be judged by fetching those files. Say plainly that you could not judge it, and read the checkout for what the code would do."
          fi
          {
            cat <<PROMPT
          You are the independent verifier for a pull request in this repository. You did not write this change. Do not merge, do not push, do not edit the checked-out repository. Judge the change, leave your evidence, then stop.

          ## The goal
          This repository is the new docs.hypertask.ai, built on Rat Stack. The parent ticket is HTPR-9125. Every pull request here is one step of that move, and its title starts with the id of its own ticket. The rule the finished site must keep: it looks exactly the same as https://docs.hypertask.ai and has the same content. Same colours, same fonts, same sizes, same corners, same words, same page addresses, same links. Rat Stack's own look is not acceptable, a rewritten sentence is not acceptable, and a missing page is not acceptable.

          ## This pull request is one step of a move, not the whole site
          Judge only what this pull request's own ticket and body claim, by comparing the parent commit against the head commit.
          - A page, route or file that is missing in BOTH the parent and the head is not a finding against this pull request. Early steps build the frame, later steps fill it, and nothing has built every page yet.
          - A page that works in the parent and is missing or broken in the head is a finding against this pull request.
          - A page that this pull request claims to have moved, and whose words, look or address differ from the live old site $LIVE_URL, is a finding.
          - Do not fail a step for work its ticket explicitly leaves to another step. Name it as a note and say which step owns it.
          - If the pull request does not claim a change for visitors, say that, and check that the visitor sees no regression.

          ## What you have
          - The pull request head $SHA is checked out at $GITHUB_WORKSPACE. That is the change under review.
          - The parent commit $BASE_SHA, the commit this change is based on, is checked out at $GITHUB_WORKSPACE/parent. That is what a visitor sees today.
          - The head site is running at $SITE_URL, from the built files in $SITE_ROOT. Serve mode for the head: $SERVE_MODE_HEAD.
          - The parent site is running at $BASE_URL, from the built files in $BASE_ROOT. Serve mode for the parent: $SERVE_MODE_PARENT.
          $dev_note
          - The built files are what a deploy uploads, so pages, markdown copies, llms files, the sitemap and images can all be fetched there.
          - The live old site is at $LIVE_URL. Fetch it sparingly, for look and content reference.
          - Playwright 1.65.1 with Chromium is installed and resolvable from $GITHUB_WORKSPACE, where the repository installs it. Screenshots go in $SCREENS_DIR.
          - verify/driver.mjs at $GITHUB_WORKSPACE opens a page, reports its status, collects its links and structure, records console errors, and screenshots it at 1440 and 390 pixels wide. Run it as node $GITHUB_WORKSPACE/verify/driver.mjs <url> <outDir>, or import its functions from your own script. Read it before you trust it: it comes from the same change you are judging, so check what it actually does.
          - verify/feature-map.md lists every user-visible feature of the docs site with the address to try and what to look for. Work down it for the pages this change touches.
          - The change under review, its title, its body, the files it touches and its diff, is at the end of this prompt.

          ## What to do
          1. Read the pull request's title and body, and name what it claims. Read the diff, then name what a reader would notice.
          2. Drive the parent site and the head site like a user, the same way for both. Use verify/feature-map.md for the addresses. Compare what each one shows: title, headings, text, navigation, links, styles, the phone layout at 390 pixels, and the browser console.
          3. Take the live old site $LIVE_URL as the reference for look and content when the parent build and the live site disagree.
          4. Try to break it. Unknown paths, a trailing slash, an asset that returns 404, text that differs from the live page, a font or colour or size or corner that differs, a link that goes nowhere, a JavaScript error, a layout that breaks on a phone, a control you cannot reach with the keyboard.
          5. Keep what you used as evidence: the pages you fetched, the text you compared, the screenshots you took.

          ## What changed for a visitor
          Say plainly what a reader of the docs site sees differently between the parent $BASE_SHA and the head $SHA. If nothing changed for a visitor, say so and say why that is correct for this change.

          ## The verdict
          Your answer's first line must be exactly one of these three, whole, with nothing else on that line and nothing before it:
          pstack-verifier: PASS @ $SHA
          pstack-verifier: PASS+NOTES @ $SHA
          pstack-verifier: FAIL @ $SHA

          PASS means you drove both sites, compared only what this pull request claims, and found nothing a reader would notice. PASS+NOTES means it works and your notes do not block the merge. FAIL means a reader would notice a regression the pull request causes, a page that worked in the parent is broken in the head, or the change does not do what its own ticket asks.

          A verdict covers the commit $SHA only. If your verdict is for any other commit, it is stale and it will be rejected.

          After that first line, in plain sentences:
          - what you ran, with the commands and the pages.
          - the evidence: what matched, what differed between parent and head, with the exact text or the screenshot file names.
          - what changed for a visitor.
          - what this step does not cover, and which later step owns it.
          - for a FAIL, the one change that would make it pass.

          Never claim something you did not run.
          PROMPT
            printf '\n## The change under review\n\n'
            cat "$RUNNER_TEMP/pr-meta.md"
            printf '\n## The files this change touches\n\n'
            cat "$RUNNER_TEMP/pr-files.txt"
            printf '\n## The diff\n\n'
            if [ "$diff_capped" = "true" ]; then
              printf 'This diff is large. The copy below is capped at %s bytes of %s bytes, across %s files. The full diff is at %s, so read more of it with sed, head or rg when the claim needs it. This cap is stated in the posted verdict.\n\n' "$diff_capped_bytes" "$diff_bytes" "$diff_files" "$RUNNER_TEMP/pr.diff"
            else
              printf 'The complete diff is below: %s bytes across %s files. It is also at %s. The stated cap for a prompt copy is %s bytes, and this diff did not reach it.\n\n' "$diff_bytes" "$diff_files" "$RUNNER_TEMP/pr.diff" "$diff_limit"
            fi
            printf '~~~diff\n'
            cat "$RUNNER_TEMP/pr.diff.capped"
            printf '~~~\n'
          } > "$RUNNER_TEMP/prompt.md"

      - name: Verify with Codex
        id: codex
        if: steps.target.outputs.go == 'yes'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          SCREENS_DIR: ${{ runner.temp }}/screens
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${CODEX_AUTH_JSON:-}" ]; then
            echo "::error::CODEX_AUTH_JSON is not set. Add the repository secret with a Codex plan login file."
            exit 1
          fi
          npm install --global --no-fund --no-audit @openai/codex@0.169.0
          agent_path="$(dirname "$(command -v codex)"):$(dirname "$(command -v node)"):/usr/local/bin:/usr/bin:/bin"
          codex_home="$(mktemp -d "$RUNNER_TEMP/codex-home.XXXXXX")"
          chmod 700 "$codex_home"
          (
            umask 077
            printf '%s' "$CODEX_AUTH_JSON" > "$codex_home/auth.json"
          )
          chmod 600 "$codex_home/auth.json"
          printf 'CODEX_HOME=%s\n' "$codex_home" >> "$GITHUB_ENV"
          auth_mode="$(jq -r '.auth_mode // "absent"' "$codex_home/auth.json" 2>/dev/null)" || auth_mode="unreadable"
          if [ "$auth_mode" != "chatgpt" ]; then
            echo "::error::CODEX_AUTH_JSON is not a Codex plan login file: its auth_mode is $auth_mode, not chatgpt. Nothing was printed from it, and the file is removed."
            exit 1
          fi
          codex_env=(
            "HOME=$HOME"
            "PATH=$agent_path"
            "TERM=dumb"
            "CODEX_HOME=$codex_home"
            "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
            "RUNNER_TEMP=$RUNNER_TEMP"
            "SCREENS_DIR=$SCREENS_DIR"
            "SITE_URL=$SITE_URL"
            "BASE_URL=$BASE_URL"
            "SITE_DEV_URL=${SITE_DEV_URL:-}"
            "BASE_DEV_URL=${BASE_DEV_URL:-}"
            "LIVE_URL=$LIVE_URL"
          )
          env -i "${codex_env[@]}" \
            codex exec \
              --skip-git-repo-check \
              --ephemeral \
              --sandbox danger-full-access \
              --cd "$GITHUB_WORKSPACE" \
              --output-last-message "$RUNNER_TEMP/verdict.md" \
              - < "$RUNNER_TEMP/prompt.md"
          first="$(grep -E '^pstack-verifier: (PASS|PASS\+NOTES|FAIL) @ [0-9a-f]{40}$' "$RUNNER_TEMP/verdict.md" 2>/dev/null | head -n 1 | sed 's/[[:space:]]*$//' || true)"
          if [[ ! "$first" =~ ^pstack-verifier:\ (PASS|PASS\+NOTES|FAIL)\ @\ ([0-9a-f]{40})$ ]]; then
            echo "::error::Codex produced no verdict in the required format: $first"
            sed -n '1,40p' "$RUNNER_TEMP/verdict.md" 2>/dev/null || true
            exit 1
          fi
          if [ "${BASH_REMATCH[2]}" != "$SHA" ]; then
            echo "::error::The Codex verdict names ${BASH_REMATCH[2]}, not the head $SHA."
            exit 1
          fi

      - name: Remove the Codex login file
        if: always()
        run: |
          set -euo pipefail
          case "${CODEX_HOME:-}" in
            "$RUNNER_TEMP"/codex-home.*)
              rm -rf -- "$CODEX_HOME"
              printf 'removed the temporary Codex login file\n'
              ;;
          esac

      - name: Post the verdict on the pull request
        id: verdict
        if: steps.target.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          PR: ${{ steps.target.outputs.number }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/verdict.md" ]; then
            echo "::error::The verifier produced no verdict. Codex: ${CODEX_OUTCOME:-not run}."
            exit 1
          fi
          first="$(grep -E '^pstack-verifier: (PASS|PASS\+NOTES|FAIL) @ [0-9a-f]{40}$' "$RUNNER_TEMP/verdict.md" | head -n 1 | sed 's/[[:space:]]*$//' || true)"
          if [[ ! "$first" =~ ^pstack-verifier:\ (PASS|PASS\+NOTES|FAIL)\ @\ ([0-9a-f]{40})$ ]]; then
            echo "::error::The verifier produced no line in the required verdict format: $first"
            sed -n '1,40p' "$RUNNER_TEMP/verdict.md"
            exit 1
          fi
          verdict="${BASH_REMATCH[1]}"
          line_sha="${BASH_REMATCH[2]}"
          if [ "$line_sha" != "$SHA" ]; then
            echo "::error::The verdict names $line_sha, not the head $SHA, so it is stale."
            exit 1
          fi
          engine_note="codex"
          diff_note="$(jq -r 'if .capped then "capped at \(.cappedBytes) bytes of \(.bytes) for the prompt, \(.files) files, the full diff is in the run artifacts" else "complete, \(.bytes) bytes, \(.files) files" end' "$RUNNER_TEMP/diff.json")"
          title="$(sed -n '1s/^Title: //p' "$RUNNER_TEMP/pr-meta.md")"
          ticket="$(printf '%s' "$title" | grep -o 'HTPR-[0-9]*' | head -n 1 || true)"
          if [ -z "$ticket" ]; then ticket="not in the title"; fi
          {
            printf '%s\n' "$first"
            printf 'engine: %s\n' "$engine_note"
            printf 'run: %s/%s/actions/runs/%s\n' "$SERVER_URL" "$REPO" "$RUN_ID"
            printf 'head: %s from %s\n' "${SITE_URL:-unset}" "${SITE_ROOT:-unset}"
            printf 'parent: %s from %s\n' "${BASE_URL:-unset}" "${BASE_ROOT:-unset}"
            printf 'serve: head %s, parent %s\n' "${SERVE_MODE_HEAD:-unset}" "${SERVE_MODE_PARENT:-unset}"
            printf 'diff: %s\n' "$diff_note"
            printf 'baseline: %s\n' "$LIVE_URL"
            printf 'ticket: %s\n\n' "$ticket"
            sed -n '2,$p' "$RUNNER_TEMP/verdict.md"
          } > "$RUNNER_TEMP/comment.md"
          existing="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(((.body // \"\") | split(\"\n\")[0]) == \"pstack-verifier: $verdict @ $SHA\") | .id" | head -n 1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
            echo "updated comment $existing"
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          fi
          printf 'verdict=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
          printf 'pstack-verifier: %s @ %s\n' "$verdict" "$SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the evidence
        if: always() && steps.target.outputs.go == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pstack-verifier-evidence
          path: |
            ${{ runner.temp }}/screens
            ${{ runner.temp }}/verdict.md
            ${{ runner.temp }}/prompt.md
            ${{ runner.temp }}/diff.json
            ${{ runner.temp }}/pr.diff
            ${{ runner.temp }}/pr.diff.capped
            ${{ runner.temp }}/pr-files.txt
            ${{ runner.temp }}/site.log
            ${{ runner.temp }}/parent.log
            ${{ runner.temp }}/site-dev.log
            ${{ runner.temp }}/parent-dev.log
          if-no-files-found: ignore

      - name: Fail the job when the verdict is FAIL
        if: steps.verdict.outputs.verdict == 'FAIL'
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          echo "::error::The verifier returned FAIL at $SHA. Read the pull request comment."
          exit 1
