name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
      TURBO_CACHE: local:rw,remote:rw
      TURBO_RUN_SUMMARY: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Enable corepack pnpm
        run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Fetch pinned source objects
        run: pnpm sources:fetch
      - name: Check and test
        # 6882060, 4 cores/16 GB: median N1=479s, N2=265s, N4=271s; N2 worst test=39.13% of budget.
        run: pnpm turbo run check test build --concurrency=2
      - name: Measure built site
        # HTPR-9180: docs-rs must report the built size it would deploy. Static
        # assets are counted from dist/client, the Worker from dist/server, and
        # the gzip figure is the whole server graph compressed as one stream.
        run: |
          set -euo pipefail
          echo "| app | static files | static bytes | worker files | worker bytes | worker gzip bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for app in apps/*/; do
            client="${app}dist/client"; server="${app}dist/server"
            [ -d "$client" ] || [ -d "$server" ] || continue
            static_files=0; static_bytes=0; worker_files=0; worker_bytes=0; worker_gzip=0
            if [ -d "$client" ]; then
              static_files=$(find "$client" -type f | wc -l)
              static_bytes=$(find "$client" -type f -exec cat {} + | wc -c)
            fi
            if [ -d "$server" ]; then
              worker_files=$(find "$server" -type f | wc -l)
              worker_bytes=$(find "$server" -type f -exec cat {} + | wc -c)
              worker_gzip=$(find "$server" -type f -exec cat {} + | gzip -9 -c | wc -c)
            fi
            name=${app#apps/}; name=${name%/}
            echo "| $name | $static_files | $static_bytes | $worker_files | $worker_bytes | $worker_gzip |" >> "$GITHUB_STEP_SUMMARY"
            echo "$name: static=$static_files files/$static_bytes bytes; worker=$worker_files files/$worker_bytes bytes/$worker_gzip gzip bytes"
          done
      - name: Upload Turbo run summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turbo-runs
          path: .turbo/runs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
