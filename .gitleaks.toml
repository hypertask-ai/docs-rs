# Base gitleaks rules for every repo agents push to (YPER4-324). Copied to each repo as
# .gitleaks.toml; add that repo's known false positives to its [allowlist] with a comment why.
[extend]
useDefault = true

# The default rules missed a Cloudflare token written as `value <token>` in a markdown table
# (agent-fleet 6ac2c153), so a 40-character token near a Cloudflare word counts as a key.
[[rules]]
id = "cloudflare-token-named-nearby"
description = "Cloudflare API token with Cloudflare named on the same line"
regex = '''(?i)(?:cloudflare|\bcf\b|\bcf_|wrangler)[^\n]{0,120}?[`'"= ]([A-Za-z0-9_-]{40})(?:[`'"\s]|$)'''
secretGroup = 1
entropy = 3.5
keywords = ["cloudflare", "cf", "wrangler"]

# A long random value in quotes or backticks next to token, secret, key or password.
[[rules]]
id = "quoted-token-named-nearby"
description = "Quoted long random value next to the word token, secret, key or password"
regex = '''(?i)(?:token|secret|api[ _-]?key|password)[^\n]{0,60}?[`'"]([A-Za-z0-9_-]{32,})[`'"]'''
secretGroup = 1
entropy = 4.0
keywords = ["token", "secret", "key", "password"]

# docs-rs (HTPR-9180) keeps these false hits from failing the scan, and nothing more.
# Each path is prose or test data that carries commit SHAs and GitHub URLs, never a
# credential: provenance notes, the audit skill's upstream record, a throwaway token in
# the crash test, the peer and git snapshot content fixtures the site renders, the earlier
# crash test path, and Joel's documented public ShieldShiba site key in the retired mischief app.
[allowlist]
description = "Commit SHAs and GitHub URLs in docs-rs content and provenance files"
paths = [
  '''^PROVENANCE\.md$''',
  '''^skills/security-audit/UPSTREAM\.md$''',
  '''^packages/crash/test/crash\.test\.ts$''',
  '''^\.brain/data/peer-refresh-[0-9-]+\.json$''',
  '''^\.brain/data/git-snapshot\.json$''',
  '''^\.brain/resources/same-version-repos\.svx$''',
  '''^packages/events/test/crash\.test\.ts$''',
  '''^apps/mischief/\.env\.schema$''',
]
